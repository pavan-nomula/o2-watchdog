<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="nirvana-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="#0c121e" />

  <!-- Outer Lotus Petals -->
  <g filter="url(#glow)" stroke="url(#nirvana-grad)" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center top arrow petal -->
    <path d="M64 22 L84 54 C80 74 64 88 64 88 C64 88 48 74 44 54 Z" stroke-width="5" />
    <!-- Arrow tip -->
    <path d="M52 38 L64 22 L76 38" stroke-width="5.5" stroke-linejoin="miter" />
    
    <!-- Left petal -->
    <path d="M34 50 C22 66 26 84 46 92 C60 86 64 82 64 82 C64 82 46 72 44 54" />
    <path d="M22 66 C14 80 26 98 48 98 C56 94 62 88 62 88" />

    <!-- Right petal -->
    <path d="M94 50 C106 66 102 84 82 92 C68 86 64 82 64 82 C64 82 82 72 84 54" />
    <path d="M106 66 C114 80 102 98 80 98 C72 94 66 88 66 88" />
  </g>

  <!-- Base arc -->
  <path d="M40 106 Q64 114 88 106" stroke="url(#nirvana-grad)" stroke-width="3" stroke-linecap="round" fill="none" />
</svg>
